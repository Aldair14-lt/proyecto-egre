# ===================================================================
# CONFIGURACIÓN DEL SERVIDOR HTTP
# ===================================================================
server.port=9090

# ===================================================================
# CONFIGURACIÓN DE CONEXIÓN A POSTGRESQL
# ===================================================================
# Reemplaza 'db_ministeriopublico' por el nombre exacto de tu base de datos en PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/db_ministeriopublico
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# CONFIGURACIÓN DE SPRING DATA JPA / HIBERNATE
# ===================================================================
# Dialecto de SQL específico para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Estrategia de creación/actualización de tablas en la BD:
# 'update': Actualiza la estructura sin borrar los datos existentes
# 'none': No realiza cambios automáticos en la BD
spring.jpa.hibernate.ddl-auto=update

# Mostrar y formatear consultas SQL ejecutadas en la consola de depuración
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# CONFIGURACIÓN DE CARGA DE RECURSOS (OPCIONAL)
# ===================================================================
# Forzar codificación UTF-8 para evitar problemas de caracteres especiales en reportes
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true